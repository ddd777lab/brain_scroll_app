name: brain_scroll
description: A research paper discovery app with TikTok-style recommendations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

  # Navigation
  go_router: ^13.0.0

  # State Management
  provider: ^6.1.1

  # Network (for future API)
  http: ^1.2.0

  # Image caching
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/paper_images/
